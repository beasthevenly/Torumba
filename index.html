<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil - son🥀✌️</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes pulseGlow {
            0%, 100% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.05); opacity: 1; }
        }
        .glow-effect {
            animation: pulseGlow 3s infinite ease-in-out;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4 font-sans select-none overflow-hidden relative">

    <!-- Luzes de fundo animadas -->
    <div class="absolute w-72 h-72 bg-purple-600/30 rounded-full blur-3xl glow-effect -z-10"></div>
    <div class="absolute w-60 h-60 bg-rose-600/20 rounded-full blur-3xl glow-effect -z-10" style="animation-delay: 1.5s;"></div>

    <!-- Cartão Principal -->
    <div class="w-full max-w-sm bg-slate-900/80 backdrop-blur-md border border-slate-800 rounded-3xl p-6 shadow-2xl flex flex-col items-center text-center space-y-6">
        
        <!-- Frame da Foto -->
        <div class="relative w-full aspect-[3/4] max-h-[380px] rounded-2xl overflow-hidden border-2 border-slate-700/60 shadow-xl">
            <!-- Botão de Upload / Exibição de Imagem -->
            <label for="upload-foto" class="cursor-pointer block w-full h-full relative group">
                <img 
                    id="foto-perfil"
                    src=""
                    alt="Perfil" 
                    class="w-full h-full object-cover hidden"
                >
                <div id="placeholder-foto" class="w-full h-full bg-slate-800 flex flex-col items-center justify-center p-6 text-slate-400 gap-3">
                    <svg class="w-12 h-12 text-purple-400 animate-bounce" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
                    </svg>
                    <span class="text-xs font-semibold text-slate-300">Toque aqui para escolher a foto no telemóvel</span>
                </div>
            </label>
            <input type="file" id="upload-foto" accept="image/*" class="hidden" onchange="carregarImagem(event)">
            
            <div class="absolute inset-0 bg-gradient-to-t from-slate-950/60 via-transparent to-transparent pointer-events-none"></div>
        </div>

        <!-- Texto son -->
        <div>
            <h1 class="text-3xl font-black tracking-wide text-slate-100 flex items-center justify-center gap-2 drop-shadow-md">
                son🥀✌️
            </h1>
        </div>

    </div>

    <script>
        function carregarImagem(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(evt) {
                    const img = document.getElementById('foto-perfil');
                    img.src = evt.target.result;
                    img.classList.remove('hidden');
                    document.getElementById('placeholder-foto').classList.add('hidden');
                    localStorage.setItem('foto_son_saved', evt.target.result);
                };
                reader.readAsDataURL(file);
            }
        }

        // Recupera foto salva anteriormente
        window.onload = function() {
            const fotoSalva = localStorage.getItem('foto_son_saved');
            if (fotoSalva) {
                const img = document.getElementById('foto-perfil');
                img.src = fotoSalva;
                img.classList.remove('hidden');
                document.getElementById('placeholder-foto').classList.add('hidden');
            }
        };
    </script>
</body>
</html>
